nodeLinker: node-modules
enableTelemetry: false
# electron-builder lists this squirrel.windows helper as a required peer of
# app-builder-lib, but it is only needed for the Squirrel target (we use NSIS).
packageExtensions:
  app-builder-lib@*:
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
