name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Same OS image used for Linux releases, so native modules are built the same way.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
