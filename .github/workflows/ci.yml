name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Same OS image used for Linux releases, so native modules are built the same way.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build
