appId: com.loganjarul.logviewer
productName: Log Viewer
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  target: dmg
win:
  target: nsis
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: anjarulrobin@gmail.com
  executableArgs:
    - --ozone-platform=x11
